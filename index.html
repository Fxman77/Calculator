<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121824">
    <title>Kalkulyator va Birliklar Almashtirgichi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</head>
<body class="dark-theme">
    <div class="calculator-app">
        <!-- Header / Controls -->
        <header class="app-header">
            <button id="toggleHistoryBtn" class="icon-btn" title="Tarix">📜</button>
            
            <div class="nav-tabs">
                <button id="calcTabBtn" class="tab-btn active" data-i18n="calcTab">🧮 Kalkulyator</button>
                <button id="converterTabBtn" class="tab-btn" data-i18n="converterTab">📏 Birliklar</button>
            </div>

            <div class="header-actions">
                <!-- 12 Top World Languages Select Dropdown -->
                <select id="langSelect" class="lang-select" title="Tilni tanlash / Select Language">
                    <option value="uz">🇺🇿 UZ</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="es">🇪🇸 ES</option>
                    <option value="pt">🇧🇷 PT</option>
                    <option value="ru">🇷🇺 RU</option>
                    <option value="hi">🇮🇳 HI</option>
                    <option value="de">🇩🇪 DE</option>
                    <option value="fr">🇫🇷 FR</option>
                    <option value="id">🇮🇩 ID</option>
                    <option value="ar">🇸🇦 AR (RTL)</option>
                    <option value="ja">🇯🇵 JA</option>
                    <option value="ko">🇰🇷 KO</option>
                </select>

                <button id="themeToggleBtn" class="theme-chip" title="Mavzuni almashtirish">☀️ Light</button>
            </div>
        </header>

        <!-- Main Calculator Section -->
        <div id="calculatorSection" class="app-section">
            <!-- Display & History Sidebar -->
            <div class="display-container">
                <div id="historyOverlay" class="history-panel hidden">
                    <div class="history-header">
                        <span data-i18n="historyTitle">Hisob-kitoblar Tarixi</span>
                        <button id="clearHistoryBtn" class="text-btn" data-i18n="historyClear">Tozalash</button>
                    </div>
                    <ul id="historyList" class="history-list">
                        <li class="empty-msg" data-i18n="emptyHistory">Hali hisoblashlar mavjud emas</li>
                    </ul>
                </div>
                
                <div class="display-box">
                    <div id="equationDisplay" class="equation-display"></div>
                    <div id="mainDisplay" class="main-display">0</div>
                </div>
            </div>

            <!-- Mode & Memory Strip -->
            <div class="sub-controls-row">
                <button id="toggleModeBtn" class="mode-chip" data-i18n="scientificMode">Ilmiy Rejim</button>
                <div class="memory-keypad">
                    <button class="btn mem-btn" id="memClear" title="Memory Clear">MC</button>
                    <button class="btn mem-btn" id="memRecall" title="Memory Recall">MR</button>
                    <button class="btn mem-btn" id="memAdd" title="Memory Add">M+</button>
                    <button class="btn mem-btn" id="memSub" title="Memory Subtract">M-</button>
                </div>
            </div>

            <!-- Scientific Keys Row -->
            <div id="scientificKeypad" class="scientific-keypad hidden">
                <button class="btn sci-btn" data-action="sin">sin</button>
                <button class="btn sci-btn" data-action="cos">cos</button>
                <button class="btn sci-btn" data-action="tan">tan</button>
                <button class="btn sci-btn" data-action="ln">ln</button>
                <button class="btn sci-btn" data-action="√">√</button>
                <button class="btn sci-btn" data-action="x²">x²</button>
                <button class="btn sci-btn" data-op="^">^</button>
                <button class="btn sci-btn" data-action="%">%</button>
            </div>

            <!-- Standard Keypad Grid (4-Column Layout) -->
            <div class="standard-keypad">
                <button class="btn clear-btn" id="clearBtn">AC</button>
                <button class="btn backspace-btn" id="backspaceBtn">⌫</button>
                <button class="btn op-btn" data-action="%">%</button>
                <button class="btn op-btn" data-op="÷">÷</button>

                <button class="btn num-btn" data-num="7">7</button>
                <button class="btn num-btn" data-num="8">8</button>
                <button class="btn num-btn" data-num="9">9</button>
                <button class="btn op-btn" data-op="×">×</button>

                <button class="btn num-btn" data-num="4">4</button>
                <button class="btn num-btn" data-num="5">5</button>
                <button class="btn num-btn" data-num="6">6</button>
                <button class="btn op-btn" data-op="-">-</button>

                <button class="btn num-btn" data-num="1">1</button>
                <button class="btn num-btn" data-num="2">2</button>
                <button class="btn num-btn" data-num="3">3</button>
                <button class="btn op-btn" data-op="+">+</button>

                <button class="btn num-btn zero-btn" data-num="0">0</button>
                <button class="btn num-btn" id="decimalBtn">.</button>
                <button class="btn equals-btn" id="equalsBtn">=</button>
            </div>
        </div>

        <!-- Unit Converter Section -->
        <div id="converterSection" class="app-section hidden">
            <div class="converter-box">
                <!-- Category Select -->
                <div class="field-group">
                    <label class="field-label" data-i18n="categoryLabel">Kategoriya:</label>
                    <select id="categorySelect" class="custom-select"></select>
                </div>

                <!-- Input Unit Row -->
                <div class="convert-row">
                    <input type="text" id="convertInput" class="convert-input" value="1" placeholder="0">
                    <select id="fromUnitSelect" class="custom-select unit-select"></select>
                </div>

                <div class="swap-icon-container">
                    <button id="swapUnitsBtn" class="swap-btn" title="Almashtirish">⇅</button>
                </div>

                <!-- Output Unit Row -->
                <div class="convert-row">
                    <input type="text" id="convertOutput" class="convert-input readonly-input" readonly value="0">
                    <select id="toUnitSelect" class="custom-select unit-select"></select>
                </div>
            </div>

            <!-- Quick Number Keypad for Converter -->
            <div class="converter-keypad">
                <button class="btn num-btn conv-key" data-key="7">7</button>
                <button class="btn num-btn conv-key" data-key="8">8</button>
                <button class="btn num-btn conv-key" data-key="9">9</button>
                <button class="btn backspace-btn conv-key" data-key="DEL">⌫</button>

                <button class="btn num-btn conv-key" data-key="4">4</button>
                <button class="btn num-btn conv-key" data-key="5">5</button>
                <button class="btn num-btn conv-key" data-key="6">6</button>
                <button class="btn clear-btn conv-key" data-key="CLR">AC</button>

                <button class="btn num-btn conv-key" data-key="1">1</button>
                <button class="btn num-btn conv-key" data-key="2">2</button>
                <button class="btn num-btn conv-key" data-key="3">3</button>
                <button class="btn num-btn conv-key" data-key=".">.</button>

                <button class="btn num-btn zero-btn conv-key" data-key="0">0</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
